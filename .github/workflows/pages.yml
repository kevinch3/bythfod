name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # devDependencies only (ajv, js-yaml for the contract harness) — nothing
      # here is shipped; assert-public-build.mjs enforces that.
      - run: npm ci
      # `npm test`, not bare `node --test`: the latter treats every file under
      # test/ as a test file and would sweep up the contract scenario modules,
      # which are run by tools/contract-live.mjs against a real server instead.
      - name: Test
        run: npm test
      - name: Verify the vendored contract is in sync with its source
        run: node tools/sync-contract.mjs --check || echo "::warning::vendored contract differs from upstream; run npm run contract:sync"
      - name: Build the offline static site
        run: node tools/build-static.mjs
      - name: Assert the public build ships no API code or credentials
        run: node tools/assert-public-build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
