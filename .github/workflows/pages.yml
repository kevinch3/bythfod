name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # devDependencies only — nothing here is shipped, and build:pages runs
      # assert-public-build.mjs to prove it.
      - run: npm ci
      # One step, and it is the same command a developer runs. This workflow
      # used to re-list typecheck, test and build-static.mjs individually, which
      # drifted from package.json twice: once when `npm test` was scoped to
      # test/*.test.js, and again when build:pages started compiling to out/.
      # ci.yml verifies on this same push; this workflow only publishes.
      - name: Build
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
